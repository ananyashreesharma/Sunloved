<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SkinLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bone: #F4EFE7;
    --bone-deep: #ECE4D6;
    --ink: #1A1714;
    --ink-soft: #4A433C;
    --ink-mute: #8A7F71;
    --line: #DDD3C2;
    --card: #FBF8F2;

    --green: #4F6B3D;
    --green-soft: #DEE2C8;
    --amber: #B5762A;
    --amber-soft: #F2DFB8;
    --red: #8A2A22;
    --red-soft: #EBC9C2;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #2A2520;
    font-family: 'Inter Tight', -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #root {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }
  *::-webkit-scrollbar { width: 0; height: 0; }
  /* hide internal phone scrollbar */
  .scroll-hide::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div id="root"></div>

<script>
  // tweak defaults — host can rewrite this block
  window.__SKINLENS_TWEAKS__ = /*EDITMODE-BEGIN*/{
    "tone": "Playful",
    "verdict": "YELLOW",
    "streak": 119,
    "screen": "share",
    "darkMode": false,
    "shareCardOpen": false,
    "lockScreen": false
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
