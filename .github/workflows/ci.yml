# Typechecks every app and runs the backend tests (label reading + verdict rules) on each push
# and pull request. A red check means something users would see is broken.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires it; nothing here connects to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run sync:shared && git diff --exit-code src/modules/ingredients/shared-labels.ts
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest
      # Shared logic and mobile helpers borrow this job's Jest (see packages/shared/jest.config.js).
      - run: npm test
        working-directory: packages/shared
      - run: npm test
        working-directory: mobile
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
